name: GitHub Pages'e Dağıt

# Vite uygulamasını derleyip GitHub Pages'e yayınlar (GitHub Actions kaynaklı Pages).
# ÖNEMLİ: Settings → Pages → Build and deployment → Source = "GitHub Actions" olmalıdır.
# "Deploy from a branch" seçiliyse GitHub derlenmemiş kaynak dosyaları yayınlar ve site beyaz görünür.

on:
  push:
    branches: [main]
  workflow_dispatch:

# En az yetki: yayın yetkisi yalnızca bağımlılık kurulmayan deploy işinde.
permissions:
  contents: read

# Aynı anda tek yayın; çalışmakta olan bir yayın yarıda kesilmez (GitHub'ın önerdiği ayar).
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      # GENEL (herkese açık) değerler: derlenmiş JavaScript'e gömülür. Supabase publishable/anon anahtarı
      # RLS ile korunduğu için tarayıcıda olabilir. service_role anahtarını ASLA buraya koymayın.
      # Değerler depo ayarlarındaki Actions Variables'tan okunur; yanlışlıkla Secrets'a girildiyse oradan.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
      # Site özel alan adının kökünde yayınlanır (Settings → Pages → Custom domain), bu yüzden "/".
      # Özel alan adı kaldırılırsa VITE_BASE_PATH değişkenini "/<depo-adı>/" yapın.
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Yapılandırmayı denetle
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Eksik değişken::Tanımlı değil:$missing. GitHub'da Settings → Secrets and variables → Actions → Variables sekmesi → New repository variable ile ekleyin (değerler yerel .env dosyanızda)."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co|https://*.supabase.co/) ;;
            *) echo "::warning title=Supabase adresi::VITE_SUPABASE_URL beklenen 'https://<proje>.supabase.co' biçiminde değil. Değeri kontrol edin." ;;
          esac
          # Turnstile yoksa site yayınlanır ama müşteri randevu alamaz ("güvenlik doğrulaması yapılandırılmamış"
          # mesajı görünür). Sunucu yine gerçek doğrulama ister; güvenlik gevşemez.
          if [ -z "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "::warning title=Turnstile::VITE_TURNSTILE_SITE_KEY tanımlı değil: site açılır ama online randevu alınamaz."
          fi
          case "$VITE_TURNSTILE_SITE_KEY" in
            1x000*|2x000*|3x000*) echo "::warning title=Turnstile::VITE_TURNSTILE_SITE_KEY bir Cloudflare TEST anahtarı; canlıda gerçek site anahtarını kullanın." ;;
          esac
          echo "Yayın yolu (base): $VITE_BASE_PATH"

      - run: npm ci --ignore-scripts

      - name: Testler
        run: npm test

      - name: Derle
        run: npm run build

      - name: Derleme çıktısını doğrula
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html üretilmedi."; exit 1; }
          if grep -q 'src="/src/main.tsx"' dist/index.html; then
            echo "::error::dist/index.html derlenmemiş kaynağa işaret ediyor."; exit 1
          fi
          grep -q "src=\"${VITE_BASE_PATH}assets/" dist/index.html || {
            echo "::error::dist/index.html içindeki JavaScript yolu '${VITE_BASE_PATH}assets/' ile başlamıyor."; exit 1
          }
          # Hash yönlendirme (/#/admin) kullanıldığı için şart değil; yanlış yazılmış derin bağlantılar
          # GitHub'ın 404 sayfası yerine uygulamayı açsın diye kopyalanır.
          cp dist/index.html dist/404.html
          echo "Doğrulandı: $(grep -o "src=\"${VITE_BASE_PATH}assets/[^\"]*\"" dist/index.html)"

      - name: Gizli anahtar taraması
        # Yayınlanacak dosyalarda sb_secret_ anahtarı veya service_role JWT'si varsa yayın durdurulur.
        run: node scripts/check-secrets.mjs dist

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
